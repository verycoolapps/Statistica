name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Statistica-win32-x64
          path: dist/Statistica-win32-x64/
      - name: Create ZIP release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/Statistica-win32-x64/* -DestinationPath dist/statistica-win32.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/statistica-win32.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build:mac
      - name: Create DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "Statistica" \
            --window-size 600 400 \
            --icon-size 100 \
            "dist/Statistica.dmg" \
            "dist/Statistica-darwin-x64/Statistica.app" || \
          cp -r dist/Statistica-darwin-x64 dist/Statistica-mac-x64 && \
          zip -r dist/statistica-mac.zip dist/Statistica-darwin-x64
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Statistica.dmg
            dist/statistica-mac.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build:linux
      - name: Create TAR
        if: startsWith(github.ref, 'refs/tags/')
        run: tar czf dist/statistica-linux.tar.gz -C dist Statistica-linux-x64
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/statistica-linux.tar.gz
